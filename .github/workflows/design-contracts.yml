name: Design contract checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  design-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Check authored JSON Schema and synthetic fixture
        run: python track_2b/docs/blueprint-v0.1/tools/validate_design.py
