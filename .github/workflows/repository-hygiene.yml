name: Repository hygiene
on:
  pull_request:
  workflow_dispatch:
jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python track_2b/tools/check_repository.py
