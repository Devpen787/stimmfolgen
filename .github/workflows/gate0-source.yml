name: Gate 0 — Source proof (no LLM credentials)
on:
  pull_request:
    paths:
      - 'track_2b/src/gate0/**'
      - 'track_2b/tests/test_gate0.py'
      - 'track_2b/tests/test_gate0*.py'
      - '.github/workflows/gate0-source.yml'
  workflow_dispatch:

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extractor
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Test safeguards without an API key
        run: python -m unittest discover -s track_2b/tests -p 'test_gate0.py' -v
      - name: Fetch official voting booklet and hash actual bytes
        run: python track_2b/src/gate0/source_probe.py --out /tmp/gate0-source.json
      - name: Publish source evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate0-real-official-source
          path: /tmp/gate0-source.json
          retention-days: 7
